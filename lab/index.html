<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GAM CLINIC — Лаборатория</title>
<meta name="description" content="Связь клиники GAM CLINIC с зуботехнической лабораторией">
<meta name="theme-color" content="#3b66a6">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GAM Лаб">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f7f6f3;--card:#fff;--ink:#2a3038;--mut:#68717a;--slate:#616a73;--blue:#88ace0;--deep:#3b66a6;
  --tint:#eaf1fa;--line:#e4e1da;--warn:#a85a08;--warnbg:#fdf0dc;--bad:#b42318;--badbg:#fde8e6;
  --ok:#2b7554;--okbg:#e3f2ea;--yel:#8a6d00;--yelbg:#fff5cc;--r:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--deep)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.hide{display:none!important}

.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding:calc(9px + env(safe-area-inset-top)) 16px 9px}
.top-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;border:0;background:none;padding:0;text-align:left}
.brand img{height:30px;width:auto;display:block}
.brand .bt{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-size:18px;font-weight:700;letter-spacing:.16em;color:var(--slate)}
.brand small{font-size:12.5px;color:var(--deep);letter-spacing:.06em;margin-top:3px;font-weight:600}
.chip-user{border:1px solid #cddcf0;background:var(--tint);border-radius:999px;padding:7px 14px;font-weight:600;color:var(--deep);min-height:40px;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live{width:9px;height:9px;border-radius:50%;background:#c9c6be;display:inline-block;margin-right:6px;vertical-align:middle}
.live.on{background:#3aa676}

main{max-width:1280px;margin:0 auto;padding:14px 16px 0}
.narrow{max-width:860px;margin:0 auto}
.banner{border-radius:12px;padding:11px 14px;margin:0 0 12px;font-size:15px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.info{background:var(--tint);color:#27497a}
.banner.warn{background:var(--warnbg);color:var(--warn)}
.banner.bad{background:var(--badbg);color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
.card h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px}
.card h3 .grow{flex:1}
.mut{color:var(--mut)}
.small{font-size:13.5px}
h2{font-size:21px;margin:4px 0 10px}

.toolbar{display:flex;gap:8px;align-items:center;margin:0 0 10px;flex-wrap:wrap}
.search{flex:1;min-width:180px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;min-height:46px}
.tgl{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-weight:600;color:var(--slate);min-height:46px}
.tgl[aria-pressed=true]{background:var(--slate);border-color:var(--slate);color:#fff}

.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:#fff;color:var(--slate);border-radius:999px;padding:8px 14px;font-weight:600;min-height:42px;white-space:nowrap}
.tab small{font-weight:600;color:var(--mut);margin-left:5px}
.tab[aria-selected=true]{background:var(--deep);border-color:var(--deep);color:#fff}
.tab[aria-selected=true] small{color:#d6e3f6}
.tab.alert{color:var(--bad);border-color:#f1c3be}
.tab.alert[aria-selected=true]{background:var(--bad);border-color:var(--bad);color:#fff}

.cols{display:block}
.col{display:none}
.col.on{display:block}
.col>h4{display:none}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
@media(min-width:1000px){
  .tabs.mob{display:none}
  .cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
  .col{display:block;background:#efede8;border-radius:16px;padding:10px;min-height:120px}
  .col.attn{grid-column:1/-1;background:#fbeeea}
  .col.attn .cards{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
  .col.attn.empty-col{display:none}
  .col>h4{display:flex;justify-content:space-between;margin:2px 4px 10px;font-size:14px;color:var(--slate)}
  .col:not(.attn) .cards{grid-template-columns:1fr}
}
.oc{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 12px;position:relative}
.oc:hover{border-color:#c7d6ec}
.oc.r{border-left:5px solid var(--bad)}
.oc.o{border-left:5px solid #e08a2c}
.oc.y{border-left:5px solid #d9b100}
.oc .l1{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--mut);font-weight:600}
.oc .fio{font-weight:700;margin:3px 0 1px;overflow-wrap:anywhere}
.oc .wk{font-size:14px;color:var(--slate)}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;align-items:center}
.tag{font-size:12.5px;border-radius:999px;padding:2px 9px;background:#eee;color:var(--slate);font-weight:600;white-space:nowrap}
.tag.bad{background:var(--badbg);color:var(--bad)}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.yel{background:var(--yelbg);color:var(--yel)}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.blue{background:var(--tint);color:var(--deep)}
.tag.dark{background:var(--deep);color:#fff}
.empty{padding:22px 12px;text-align:center;color:var(--mut);font-size:14.5px}
.fab{position:fixed;right:18px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:26;border:0;background:var(--deep);color:#fff;border-radius:999px;padding:14px 20px;font-weight:700;box-shadow:0 8px 24px rgba(30,60,110,.3);min-height:52px}

nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:24;background:#fff;border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav.bar div{max-width:760px;margin:0 auto;display:flex;gap:6px}
nav.bar button{flex:1;border:0;background:none;border-radius:12px;padding:6px 4px;color:var(--mut);font-weight:600;font-size:13.5px;min-height:52px;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.bar button svg{width:22px;height:22px}
nav.bar button[aria-current=page]{background:var(--tint);color:var(--deep)}
nav.bar .dot{position:absolute;top:2px;left:calc(50% + 10px);background:var(--bad);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;line-height:18px;padding:0 5px;font-weight:700}

.btn{border:0;background:var(--deep);color:#fff;border-radius:12px;padding:11px 16px;font-weight:700;min-height:46px}
.btn.alt{background:#fff;color:var(--deep);border:1.5px solid var(--deep)}
.btn.ghost{background:#eef1f5;color:var(--slate)}
.btn.bad{background:var(--bad)}
.btn.okb{background:var(--ok)}
.btn.yelb{background:#c79a00}
.btn.sm{padding:7px 12px;min-height:38px;font-size:14.5px;border-radius:10px}
.btn[disabled]{opacity:.5;pointer-events:none}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.acts .btn{flex:1 1 180px}
.small-acts{margin-top:8px}
.small-acts .btn{flex:0 1 auto}
.field{display:block;margin:0 0 14px}
.field>span,.lbl{display:block;font-weight:600;font-size:14px;color:var(--slate);margin-bottom:6px}
.inp{width:100%;border:1px solid #cfccc4;background:#fff;border-radius:11px;padding:10px 12px;min-height:46px}
textarea.inp{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.two{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{border:1px solid #d5d2ca;background:#fff;border-radius:999px;padding:8px 13px;font-weight:600;color:var(--slate);min-height:40px}
.chips button[aria-pressed=true]{background:var(--deep);border-color:var(--deep);color:#fff}
.chk{display:flex;gap:10px;align-items:center;min-height:40px;font-weight:600;color:var(--slate)}
.chk input{width:22px;height:22px;accent-color:var(--deep)}

.teeth{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:3px;max-width:640px}
.teeth button{border:1px solid #d5d2ca;background:#fff;border-radius:7px;padding:0;height:36px;font-size:12.5px;font-weight:700;color:var(--slate);font-variant-numeric:tabular-nums}
.teeth button[aria-pressed=true]{background:var(--deep);border-color:var(--deep);color:#fff}
.teeth button.mid{margin-left:5px}
.teeth .sep{grid-column:1/-1;height:1px;background:var(--line);margin:3px 0}
.teeth.ro button{cursor:default;height:26px;font-size:11px}
.teeth.ro button[aria-pressed=false]{color:#c4c1b9;border-color:#ece9e2}
@media(max-width:420px){.teeth button{height:32px;font-size:11px}}

.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:15px}
.kv dt{color:var(--mut)}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.ohead{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.ohead h2{flex:1;margin:0}
.back{border:0;background:none;color:var(--deep);font-weight:600;padding:6px 0;margin-bottom:4px}
.steps{display:flex;gap:4px;margin:10px 0 6px}
.steps i{flex:1;height:6px;border-radius:4px;background:#e4e1da}
.steps i.on{background:var(--deep)}
.steps i.cur{background:var(--blue)}
.stepl{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);gap:4px}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:1000px){.grid2{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}}

.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:8px 9px;text-align:right;white-space:nowrap;border-top:1px solid var(--line)}
th{color:var(--slate);font-size:12.5px;border-top:0;background:#f5f3ef}
th:first-child,td:first-child{text-align:left;white-space:normal}
td.neg{color:var(--bad);font-weight:700}
tr.click{cursor:pointer}
tr.click:hover td{background:#f4f8fd}

.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.gal a,.gal .fx{display:block;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#eef1f5;border:1px solid var(--line);position:relative;text-decoration:none;color:var(--slate)}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal .fx{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;font-size:11.5px;text-align:center;overflow-wrap:anywhere;font-weight:600}
.gal .fx b{font-size:15px;color:var(--deep)}
.gal .del{opacity:.5;font-style:italic}

.chat{display:flex;flex-direction:column;gap:8px;max-height:none}
.msg{max-width:88%;background:#f1efea;border-radius:14px;padding:8px 12px;align-self:flex-start}
.msg.me{background:var(--tint);align-self:flex-end}
.msg.lab{background:#f3eefb}
.msg .who{font-size:12.5px;font-weight:700;color:var(--slate);display:flex;gap:8px;justify-content:space-between}
.msg .who span{font-weight:500;color:var(--mut)}
.msg .tx{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
.msg .gal{margin-top:6px;grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}
.ev{align-self:center;max-width:94%;font-size:13px;color:var(--mut);background:none;border:1px dashed #d8d4cb;border-radius:12px;padding:6px 11px;white-space:pre-wrap}
.ev b{color:var(--slate)}
.composer{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;margin-top:10px;box-shadow:0 6px 20px rgba(0,0,0,.06)}
.composer textarea{border:0;width:100%;min-height:44px;max-height:180px;resize:none;padding:6px 6px;outline:0}
.composer .rowx{display:flex;gap:6px;align-items:center}
.ibtn{border:1px solid var(--line);background:#fff;border-radius:10px;min-width:44px;height:42px;display:inline-flex;align-items:center;justify-content:center;color:var(--slate);padding:0 10px;gap:6px;font-weight:600;font-size:14px}
.ibtn svg{width:20px;height:20px}
.pend{display:flex;flex-wrap:wrap;gap:6px;margin:4px 2px 6px}
.pend span{background:#eef1f5;border-radius:8px;padding:3px 8px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.pend button{border:0;background:none;color:var(--bad);font-weight:700;padding:0 2px}
.prog{height:4px;background:#e4e1da;border-radius:3px;overflow:hidden;margin:4px 2px}
.prog i{display:block;height:100%;background:var(--deep);width:0}

.ov{position:fixed;inset:0;background:rgba(30,38,50,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));position:relative}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:20px}}
.sheet h3{margin:0 0 12px;font-size:19px;padding-right:40px}
.sheet .x{position:absolute;top:10px;right:10px;width:40px;height:40px;border:0;border-radius:50%;background:#eef1f5;font-size:24px;line-height:1;color:var(--slate)}
.itm{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.itm:first-child{border-top:0}
.itm .grow{flex:1;min-width:0;font-weight:600;font-size:15px;overflow-wrap:anywhere}
.itm .grow small{display:block;font-weight:500;color:var(--mut)}
.gh{font-weight:700;color:var(--slate);font-size:13.5px;margin:12px 0 2px;text-transform:uppercase;letter-spacing:.04em}
.stp{display:flex;align-items:center;border:1px solid #d5d2ca;border-radius:999px;flex:none;background:#fff}
.stp button{width:40px;height:40px;border:0;background:none;font-size:22px;line-height:1;color:var(--deep)}
.stp span{min-width:24px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.stp.on{background:var(--deep);border-color:var(--deep)}
.stp.on button,.stp.on span{color:#fff}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:6px 0 12px}
.pick button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 10px;font-weight:600;min-height:52px;overflow-wrap:anywhere}
.dots{display:flex;gap:14px;justify-content:center;margin:10px 0 16px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--deep);display:block}
.dots i.on{background:var(--deep)}
.dots.err i{border-color:var(--bad);background:var(--badbg)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto}
.pad button{border:1px solid var(--line);background:#fff;border-radius:16px;height:60px;font-size:24px;font-weight:600}
.pad .e{visibility:hidden}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.pin-show{font-size:44px;letter-spacing:.3em;text-align:center;font-weight:700;color:var(--deep);background:var(--tint);border-radius:14px;padding:12px 0 12px .3em;margin:8px 0}
#toast{position:fixed;left:0;right:0;bottom:calc(90px + env(safe-area-inset-bottom));z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{pointer-events:auto;background:#2a3038;color:#fff;border-radius:12px;padding:11px 14px;box-shadow:0 8px 22px rgba(0,0,0,.25);max-width:520px}
.toast.bad{background:var(--bad)}
.combo{position:relative}
.sugg{position:absolute;left:0;right:0;top:100%;z-index:70;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 26px rgba(0,0,0,.16);max-height:270px;overflow-y:auto;margin-top:4px}
.sugg button{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 14px;border-top:1px solid var(--line);min-height:46px}
.sugg button:first-child{border-top:0}
.sugg small{color:var(--mut)}
.loading{padding:30px;text-align:center;color:var(--mut)}
.meter{height:14px;border-radius:8px;background:#e9e7e1;overflow:hidden;margin:8px 0}
.meter i{display:block;height:100%;background:var(--deep)}
.meter.w i{background:#e08a2c}.meter.b i{background:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stats div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.stats b{display:block;font-size:26px;color:var(--deep);font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--mut)}
.urow{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.urow:first-child{border-top:0}
.urow .grow{flex:1;min-width:0}
.foot{text-align:center;color:var(--mut);font-size:13px;margin:26px 0 8px}
.lb{position:fixed;inset:0;background:rgba(10,14,20,.92);z-index:80;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:14px}
.lb img{max-width:100%;max-height:82vh;border-radius:8px}
.lb .rowx{display:flex;gap:8px}

/* ---- живой вид ---- */
body{background:linear-gradient(180deg,#e4eefb 0,#f1f4f8 380px,#f6f5f1 900px) fixed}
.top{border-bottom:0;box-shadow:0 1px 0 #dfe6ef}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:linear-gradient(90deg,#3b66a6,#88ace0 45%,#7fd0b0 75%,#e8b86d)}
.card{box-shadow:0 1px 2px rgba(30,50,80,.04),0 6px 18px rgba(30,50,80,.05);border-color:#e6e9ee}
.oc{display:grid;grid-template-columns:50px 1fr;gap:0 10px;align-items:start;box-shadow:0 1px 2px rgba(30,50,80,.05);transition:transform .12s,box-shadow .12s}
.oc:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(30,60,110,.12)}
.oc .ic{grid-row:1/5;width:50px;height:50px;border-radius:14px;background:linear-gradient(145deg,#eef4fc,#dde9f8);display:flex;align-items:center;justify-content:center}
.oc .ic svg{width:42px;height:42px}
.oc .l1,.oc .fio,.oc .wk,.oc .meta{grid-column:2}
.oc .dr{font-weight:500;color:var(--mut);font-size:13.5px}
.blogo{height:14px;width:auto;max-width:90px;vertical-align:-2px;margin-right:3px;object-fit:contain}
.hc .blogo{height:16px}
.kv .blogo{height:17px}
.blogo.lg{height:20px;max-width:140px}
.mi{display:inline-flex;align-items:center;gap:4px;vertical-align:middle}
.mi svg{width:18px;height:18px}
.ichip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;border-radius:999px;padding:1px 9px 1px 4px;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 30%,#fff);white-space:nowrap}
.ichip svg{width:18px;height:18px}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid #c9b994;vertical-align:-2px;margin-right:5px}
@media(min-width:1000px){
  .col{border-top:4px solid #b9c0c9;background:#eef0f3}
  .col.c-new{border-top-color:#8a95a3;background:#edf0f4}
  .col.c-lab{border-top-color:#7b5cc4;background:#f0ecfa}
  .col.c-clinic{border-top-color:#2b9466;background:#e7f4ed}
  .col.c-done{border-top-color:#3b66a6;background:#e9eff8}
  .col.attn{border-top-color:#d0392b;background:#fbece8}
  .col>h4 span:first-child{display:flex;align-items:center;gap:7px}

const canStats = () => role() === 'super' || role() === 'admin';

/* ============================ сеть ============================ */
async function rpc(fn, args) {
  const r = await fetch(SB + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(args || {}) });
  if (!r.ok) {
    let j = null; try { j = await r.json(); } catch (e) {}
    const err = new Error((j && (j.message || j.msg)) || r.statusText); err.status = r.status; throw err;
  }
  return r.status === 204 ? null : r.json();
}
const call = (fn, args) => rpc(fn, Object.assign({ p_token: S.tok }, args || {}));
async function fnFiles(body) {
  const r = await fetch(SB + '/functions/v1/lab-files', { method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ token: S.tok }, body)) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const ERR = {
  AUTH: 'Нужно войти заново', FORBIDDEN: 'Нет доступа', NOTFOUND: 'Работа не найдена', BADSTATE: 'Статус работы уже изменился — обновите страницу',
  EMPTY: 'Заполните обязательные поля', NOTE: 'Опишите, что нужно исправить', SHORTPASS: 'Пароль — минимум 6 символов', CLOSED: 'Работа закрыта',
  SELF: 'Нельзя изменить свою роль или отключить себя', TOOBIG: 'Файл больше 50 МБ', NOFILE: 'Файл не загрузился, попробуйте ещё раз',
  LOGIN_TAKEN: 'Такой логин уже занят', EXISTS: 'Суперадмин уже создан', BADLOGIN: 'Неверный логин или пароль', LOCKED: 'Слишком много попыток. Подождите 10 минут',
};
function errText(e) {
  const m = String(e && e.message || e);
  if (ERR[m]) return ERR[m];
  if (e instanceof TypeError || /fetch|network|load failed/i.test(m)) return 'Нет связи с сервером. Проверьте интернет';
  return m;
}
async function guard(fn) {
  try { return await fn(); } catch (e) {
    if (String(e.message) === 'AUTH') { logout(true); }
    toast(errText(e), true);
    return undefined;
  }
}
function toast(msg, bad, ms = bad ? 5000 : 2600) {
  const t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); t.textContent = msg;
  $('#toast').appendChild(t); setTimeout(() => t.remove(), ms);
}

/* ============================ флаги работы ============================ */
function flags(o) {
  const today = mskDate();
  const out = { overdue: false, risk: false, short: false, delayed: !!o.delayed };
  const due = o.due || o.due_date;
  if (due && ['new', 'at_lab', 'lab_ready'].includes(o.status)) {
    if (today > due) out.overdue = true; else if (today >= warnDate(due)) out.risk = true;
  }
  out.short = (o.away > 0) && ['at_clinic', 'delivered', 'cancelled'].includes(o.status);
  out.attn = out.overdue || out.risk || out.short || out.delayed;
  return out;
}
function dueTag(o) {
  const due = o.due || o.due_date; if (!due) return '';
  const f = flags(o);
  const cls = f.overdue ? 'bad' : f.risk ? 'bad' : o.status === 'at_clinic' ? 'ok' : 'blue';
  return `<span class="tag ${cls}">${f.overdue ? 'Просрочено · ' : ''}Визит ${dmy(due, true)}</span>`;
}

/* ============================ доска ============================ */
const COLS = [
  { k: 'attn', t: 'Требуют внимания', f: (o) => flags(o).attn && o.status !== 'cancelled' },
  { k: 'new', t: 'Ожидают отправки', f: (o) => o.status === 'new' },
  { k: 'lab', t: 'В лаборатории', f: (o) => o.status === 'at_lab' || o.status === 'lab_ready' },
  { k: 'clinic', t: 'В клинике', f: (o) => o.status === 'at_clinic' },
  { k: 'done', t: 'Сданы', f: (o) => o.status === 'delivered' || o.status === 'cancelled' },
];
function card(o) {
  const f = flags(o);
  const tags = [];
  tags.push(`<span class="tag ${STCLS[o.status] || ''}">${STATUS[o.status]}</span>`);
  if (o.purpose && ['at_lab', 'lab_ready', 'at_clinic'].includes(o.status)) tags.push(`<span class="tag">${PURP[o.purpose] || ''}</span>`);
  if (f.delayed) tags.push('<span class="tag yel">Задерживается</span>');
  if (f.short) tags.push(`<span class="tag warn">Не вернулось: ${o.away}</span>`);
  if (o.remakes) tags.push(`<span class="tag">Доработок: ${o.remakes}</span>`);
  if (o.unread && !['delivered', 'cancelled'].includes(o.status)) tags.push(`<span class="tag dark">💬 ${o.unread}</span>`);
  const cls = f.overdue || f.risk ? 'r' : f.short ? 'o' : f.delayed ? 'y' : '';
  return `<button class="oc ${cls}" data-go="o/${o.id}"><span class="ic">${workIcon(o.work_type, o.implant)}</span>
    <div class="l1"><span>${num(o.id)}</span>${dueTag(o)}</div>
    <div class="fio">${esc(o.fio)}${o.doctor ? `<span class="dr"> · ${esc(o.doctor)}</span>` : ''}</div>
    <div class="wk">${esc(o.work_type)}${o.teeth && o.teeth.length ? ' · ' + teethTxt(o.teeth) : ''}${o.shade ? ' · ' + swatch(o.shade) + esc(o.shade) : ''}</div>
    ${o.implant ? `<div class="meta">${implChips(o)}</div>` : ''}
    <div class="meta">${tags.join('')}</div></button>`;
}
function filtered() {
  const q = S.q.trim().toLowerCase();

}

    <div class="cols">${groups.map((g) => `<section class="col c-${g.k} ${g.k === 'attn' ? 'attn' : ''} ${S.tab === g.k ? 'on' : ''} ${g.items.length ? '' : 'empty-col'}">
      <h4><span>${g.t}</span><span>${g.items.length}</span></h4>
      ${g.items.length ? `<div class="cards">${g.items.map(card).join('')}</div>` : `<div class="empty">${S.loaded ? (S.q ? 'Ничего не найдено' : 'Пусто') : 'Загрузка…'}</div>`}
      ${g.k === 'done' ? '<div class="empty small">Показаны работы за последние 45 дней. Старые — через поиск.</div>' : ''}</section>`).join('')}</div>`);
  const qi = $('#q');
  qi.addEventListener('input', () => { S.q = qi.value; clearTimeout(qi._t); qi._t = setTimeout(async () => { if (S.q.trim().length >= 2) await loadList(); const pos = qi.selectionStart; renderBoard(); const n = $('#q'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} }, 250); });

async function loadList() {
  try { S.list = await call('lab_list', { p_q: S.q.trim().length >= 2 ? S.q.trim() : null }); S.loaded = true; }
  catch (e) { if (String(e.message) === 'AUTH') return logout(true); toast(errText(e), true); }

/* ============================ карточка работы ============================ */
function teethChart(sel, ro) {
  const s = new Set(sel || []);
  const b = (n, i) => `<button type="button" data-tooth="${n}" aria-pressed="${s.has(n)}" class="${i === 8 ? 'mid' : ''}" ${ro ? 'tabindex="-1"' : ''}>${n}</button>`;
  return `<div class="teeth ${ro ? 'ro' : ''}" ${ro ? '' : 'id="teeth"'}>${UP.map(b).join('')}<i class="sep"></i>${LO.map(b).join('')}</div>`;
}
function stageIdx(o) {
  if (o.status === 'delivered') return 4;
  const p = o.purpose;
  if (o.status === 'new') return 0;
  if (p === 'try1') return o.status === 'at_clinic' ? 1 : 1;
  if (p === 'try2') return 2;
  if (p === 'final') return 3;
  return 0;
}
function fileTile(f, big) {
  if (f.deleted) return `<span class="fx del" title="${esc(f.name)}">удалён<br>${esc(f.name)}</span>`;
  const u = S.urls[f.path];
  if (isImg(f.mime) && u) return `<a href="#" data-img="${esc(f.path)}" title="${esc(f.name)}"><img src="${esc(u)}" loading="lazy" alt=""></a>`;
  const ext = (f.name.match(/\.([a-z0-9]{1,6})$/i) || [, 'файл'])[1].toUpperCase();
  return u ? `<a class="fx" href="${esc(u)}&download=${encodeURIComponent(f.name)}" target="_blank" rel="noopener"><b>${esc(ext)}</b>${esc(f.name)}<br>${mb(f.size)}</a>`
           : `<span class="fx"><b>${esc(ext)}</b>${esc(f.name)}</span>`;
}
async function loadUrls(files) {
  const need = files.filter((f) => !f.deleted && !S.urls[f.path]).map((f) => f.path);
  if (!need.length) return;
  try { const r = await fnFiles({ action: 'urls', paths: need }); Object.assign(S.urls, r.urls || {}); } catch (e) {}
}
async function loadOrder(id) {
  try {
    const d = await call('lab_order', { p_id: id });
    S.order = d; S.oid = id;
    const files = d.msgs.flatMap((m) => m.files);
    await loadUrls(files);
    const l = S.list.find((o) => o.id === id); if (l) l.unread = 0;
    return d;
  } catch (e) { if (String(e.message) === 'AUTH') { logout(true); return null; } toast(errText(e), true); return null; }
}
function actionsFor(o, away) {
  const a = [];
  const closed = ['delivered', 'cancelled'].includes(o.status);
  if (isClinic()) {
    if (o.status === 'new') a.push(['send', 'Отправить в лабораторию', '']);
    if (o.status === 'at_lab' || o.status === 'lab_ready') a.push(['receive', 'Работа получена в клинике', 'okb']);
    if (o.status === 'at_clinic') { a.push(['deliver', 'Сдано пациенту', 'okb']); a.push(['send', 'Отправить в лабораторию', 'alt']); }
    if (!closed) a.push(['edit', 'Изменить', 'sm ghost']);
    a.push(['more', '+ Ещё работа пациенту', 'sm ghost']);
    if (!closed && ['super', 'admin', 'doctor'].includes(role())) a.push(['cancel', 'Отменить работу', 'sm ghost']);
  } else {
    if (o.status === 'at_lab') { a.push(['ready', 'Готово — отправить в клинику', 'okb']); a.push([o.delayed ? 'undelay' : 'delay', o.delayed ? 'Снять задержку' : 'Задерживается', o.delayed ? 'ghost' : 'yelb']); }
  }
  return a;
}

/* ============================ файлы ============================ */
async function shrink(f) {
  if (!/^image\/(jpeg|png|webp)$/.test(f.type) || typeof createImageBitmap !== 'function') return f;
  try {
    const bmp = await createImageBitmap(f);
    const s = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
    if (s === 1 && f.size < 1.5e6) return f;
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const b = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.82));
    return b && b.size < f.size ? new File([b], f.name.replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' }) : f;
  } catch (e) { return f; }
}
function putFile(url, file, onp) {

    const x = new XMLHttpRequest(); x.open('PUT', url);
    x.setRequestHeader('x-upsert', 'false'); x.setRequestHeader('apikey', KEY);

async function sendMsg() {
  const id = S.order.order.id;
  const text = ($('#msg') ? $('#msg').value : '').trim();
  if (!text && !S.pend.length) return;
  const btn = $('[data-act=send-msg]'); if (btn) btn.disabled = true;
  try {
    const done = [];
    const total = S.pend.reduce((s, p) => s + p.file.size, 0) || 1; let base = 0;
    for (const p of S.pend) {
      p.busy = true;
      const up = await fnFiles({ action: 'upload', order_id: id, name: p.file.name, size: p.file.size });
      await putFile(up.url, p.file, (fr) => { const g = $('#prog'); if (g) g.style.width = Math.round((base + fr * p.file.size) / total * 100) + '%'; });
      base += p.file.size;
      done.push({ path: up.path, name: p.file.name, mime: p.file.type || '' });
    }
    await call('lab_msg', { p_id: id, p_text: text, p_files: done });
    S.pend = []; S.draft[id] = '';
    await refreshOrder(id);
    const ch = $('#chat'); if (ch) ch.lastElementChild?.scrollIntoView({ block: 'nearest' });
  } catch (e) {
    S.pend.forEach((p) => (p.busy = false));

  }
}
async function addFiles(list) {
  for (const f0 of list) {
    const f = await shrink(f0);

    S.pend.push({ file: f });
  }
  const m = $('#msg'); if (m) S.draft[S.oid] = m.value;
  renderOrder();
}

}
async function logout(silent) {
  if (S.tok && !silent) { try { await rpc('lab_logout', { p_token: S.tok }); } catch (e) {} }
  S.tok = null; S.me = null; S.boot = null; S.list = []; S.order = null; LS.del('gamlab_tok'); LS.del('gamlab_me');
  closeSheet(); renderWho(); renderNav(); if (!silent) toast('Вы вышли'); location.hash = '#/'; render();
}

/* ============================ отрисовка ============================ */
async function render() {
  renderWho();
  if (!S.tok) { renderNav(); return renderLogin(); }
  if (!S.boot) { pane('<div class="loading">Загрузка…</div>'); await loadAll(); if (!S.tok) return; }
  const [r, a] = route();
  renderNav();
  if (r === 'o' && a) {
    const id = +a;
    if (!S.order || S.oid !== id) { S.order = null; S.pend = []; pane('<div class="loading">Загрузка…</div>'); await loadOrder(id); }
    if (route()[0] !== 'o' || +route()[1] !== id) return;
    renderOrder();
    if (S.afterOpen === 'send' && S.order && S.order.order.status === 'new') { S.afterOpen = null; openSend(); }
  } else if (r === 'new') {
    if (!isClinic()) return go('');
    if (!F || F.id) { F = blankForm(); if (S.prefill) { Object.assign(F, S.prefill); S.prefill = null; } }
    renderForm();
  } else if (r === 'edit' && a) {
    const id = +a;
    if (!F || F.id !== id) {
      if (!S.order || S.oid !== id) await loadOrder(id);
      const o = S.order.order;
      F = { id: o.id, patient_id: o.patient_id, fio: o.fio, doctor_id: o.doctor_id, lab_id: o.lab_id, work_type: o.work_type, teeth: o.teeth.slice(), implant: o.implant, implant_system: o.implant_system || '', implant_map: legacyMap(o), method: o.method || '',
        temp: o.temp, material: o.material || '', shade: o.shade || '', shade_note: o.shade_note || '', notes: o.notes || '', due_date: o.due_date || '' };
    }
    renderForm();
  } else if (r === 'away') renderAway();
  else if (r === 'stats') renderStats();
  else if (r === 'settings') renderSettings();
  else { F = null; renderBoard(); }
}
function legacyMap(o) {
  const m = Object.assign({}, o.implant_map || {});
  if (o.implant && !Object.keys(m).length && SYSTEMS.includes(o.implant_system)) o.teeth.forEach((t) => { m[t] = o.implant_system; });
  else if (o.implant && !Object.keys(m).length && /:/.test(o.implant_system || '')) o.implant_system.split(';').forEach((part) => { const [sys, ts] = part.split(':'); (ts || '').split(',').map((x) => x.trim()).filter(Boolean).forEach((t) => { m[t] = sys.trim(); }); });
  return m;
}
async function loadAll() {
  try {
    const [b, l] = await Promise.all([call('lab_boot'), call('lab_list')]);
    S.boot = b; S.me = b.me; LS.set('gamlab_me', S.me); S.list = l; S.loaded = true;
    if (S.mine == null) S.mine = S.me.role === 'doctor';
  } catch (e) {
    if (String(e.message) === 'AUTH') return logout(true);
    pane(`<div class="narrow"><div class="banner bad">${esc(errText(e))}</div><button class="btn" data-act="reload">Повторить</button></div>`);
  }
}
async function refreshOrder(id) {
  await Promise.all([loadOrder(id), loadList()]);
  const [r, a] = route();
  if (r === 'o' && +a === id) renderOrder();
  renderNav();
}

/* ============================ события ============================ */
document.addEventListener('click', async (e) => {
  const g = e.target.closest('[data-go]');
  if (g && !e.target.closest('[data-act]')) { e.preventDefault(); go(g.dataset.go); return; }
  const im = e.target.closest('[data-img]');
  if (im) {
    e.preventDefault(); const u = S.urls[im.dataset.img]; const f = S.order?.msgs.flatMap((m) => m.files).find((x) => x.path === im.dataset.img);
    const lb = document.createElement('div'); lb.className = 'lb';
    lb.innerHTML = `<img src="${esc(u)}" alt=""><div class="rowx"><a class="btn sm" href="${esc(u)}&download=${encodeURIComponent(f ? f.name : 'photo.jpg')}" target="_blank" rel="noopener">Скачать</a><button class="btn sm ghost">Закрыть</button></div>`;
    lb.addEventListener('click', (ev) => { if (!ev.target.closest('a')) lb.remove(); }); document.body.appendChild(lb); return;
  }
  const tb = e.target.closest('[data-tab]');
  if (tb) { S.tab = tb.dataset.tab; LS.set('gamlab_tab', S.tab); renderBoard(); return; }
  const tooth = e.target.closest('#teeth [data-tooth]');
  if (tooth && F) { const n = +tooth.dataset.tooth; F.teeth = F.teeth.includes(n) ? F.teeth.filter((x) => x !== n) : F.teeth.concat(n); tooth.setAttribute('aria-pressed', F.teeth.includes(n)); $('#f-tt').textContent = teethTxt(F.teeth);
    if (F.teeth.includes(n) && F.implant && !F.implant_map[n]) { const used = Object.values(F.implant_map).filter((v) => v !== 'pontic'); if (used.length && used.every((v) => v === used[0])) F.implant_map[n] = used[0]; }
    if (!F.teeth.includes(n)) delete F.implant_map[n];
    $('#f-implbox').innerHTML = implBox(); return; }
  const chip = e.target.closest('[data-chips] button');
  if (chip && F) {
    const key = chip.parentElement.dataset.chips; let v = chip.dataset.v;
    readForm();
    if (key === 'temp') { F.temp = v === '1'; if (F.temp && (!F.material || F.material === 'Диоксид циркония')) F.material = 'PMMA'; if (!F.temp && (!F.material || F.material === 'PMMA')) F.material = 'Диоксид циркония'; }
    else { F[key] = F[key] === v ? '' : v; if (key === 'work_type' && /имплант|all-on|балоч/i.test(v)) F.implant = true; }
    renderForm(); return;
  }
  const rp = e.target.closest('#r-p button');
  if (rp) { rp.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b === rp)); return; }
  const t = e.target.closest('[data-act]'); if (!t) return;
  const d = t.dataset;
  switch (d.act) {
    case 'close': closeSheet(); break;
    case 'reload': location.reload(); break;
    case 'account': sheet(`<h3>${esc(S.me.name)}</h3><div class="mut" style="margin-bottom:6px">${ROLES[S.me.role]}</div>
        <div class="small mut">${S.live ? '● Изменения появляются сразу, без обновления страницы.' : '○ Онлайн-обновление недоступно — обновляем раз в минуту.'}</div>
        <div class="acts">${S.me.role !== 'assistant' ? '<button class="btn alt" data-act="chpass">Сменить пароль</button>' : ''}<button class="btn bad" data-act="logout">Выйти</button></div>`); break;
    case 'chpass': sheet(`<h3>Сменить пароль</h3><label class="field"><span>Текущий пароль</span><input class="inp" type="password" id="cp-o" autocomplete="current-password"></label><label class="field"><span>Новый пароль (минимум 6 символов)</span><input class="inp" type="password" id="cp-n" autocomplete="new-password"></label><div class="acts"><button class="btn" data-act="chpass-go">Сохранить</button></div>`); break;
    case 'chpass-go': { const r = await guard(() => call('lab_change_pass', { p_old: $('#cp-o').value, p_new: $('#cp-n').value })); if (r) { if (r.ok) { closeSheet(); toast('Пароль изменён'); } else toast('Текущий пароль неверный', true); } break; }
    case 'logout': logout(); break;
    case 'mine': S.mine = !S.mine; LS.set('gamlab_mine', S.mine); renderBoard(); break;
    case 'login': doLogin(); break;
    case 'setup': {
      const r = await guard(() => rpc('lab_setup', { p_name: $('#su-name').value, p_login: $('#su-login').value, p_pass: $('#su-pass').value }));
      if (r && r.ok) startSession(r); break;
    }
    case 'pin-pick': PIN = { id: +d.id, name: d.name, v: '' }; pinPad(); break;
    case 'pk': pinKey(d.k); break;
    // форма
    case 'form-cancel': { const id = F && F.id; F = null; go(id ? 'o/' + id : ''); break; }
    case 'form-save': saveForm(false); break;
    case 'form-save-send': saveForm(true); break;
    case 'f-pat': F.patient_id = +d.id; F.fio = d.fio; readForm(); F.fio = d.fio; renderForm(); break;
    case 'im-all': F.teeth.forEach((x) => { F.implant_map[x] = d.v; }); $('#f-implbox').innerHTML = implBox(); break;
    case 'im-one': F.implant_map[d.t] = d.v; $('#f-implbox').innerHTML = implBox(); break;
    case 'f-newpat': F.patient_id = null; readForm(); renderForm(); break;
    // работа
    case 'o-send': openSend(); break;
    case 'o-receive': openReceive(); break;
    case 'o-back': openBack(); break;
    case 'o-ready': openReady(); break;
    case 'o-delay': openDelay(); break;
    case 'o-undelay': { const id = S.order.order.id; const r = await guard(() => call('lab_delay', { p_id: id, p_on: false, p_note: null })); if (r !== undefined) { toast('Задержка снята'); refreshOrder(id); } break; }
    case 'o-edit': F = null; go('edit/' + S.order.order.id); break;
    case 'o-more': { const o = S.order.order; F = null; S.prefill = { patient_id: o.patient_id, fio: o.fio, doctor_id: o.doctor_id, lab_id: o.lab_id, due_date: o.due_date || '' }; go('new'); break; }
    case 'o-deliver': {
      const away = outstanding(S.order).reduce((s, i) => s + i.left, 0);
      sheet(`<h3>Сдать работу пациенту?</h3>${away ? `<div class="banner warn"><span>В лаборатории остаются предметы клиники: ${away} шт. Работа будет закрыта, но предметы останутся в списке «не вернулись».</span></div>` : ''}<div class="small mut">Работа будет закрыта. История и файлы сохранятся.</div><div class="acts"><button class="btn okb" data-act="deliver-go">Сдано пациенту</button></div>`); break;
    }
    case 'deliver-go': { const id = S.order.order.id; const r = await guard(() => call('lab_deliver', { p_id: id })); if (r !== undefined) { closeSheet(); toast('Работа сдана и закрыта'); refreshOrder(id); } break; }
    case 'o-cancel': sheet(`<h3>Отменить работу?</h3><label class="field"><span>Причина</span><textarea class="inp" id="c-note" rows="3"></textarea></label><div class="acts"><button class="btn bad" data-act="cancel-go">Отменить работу</button></div>`); break;
    case 'cancel-go': { const id = S.order.order.id; const r = await guard(() => call('lab_cancel', { p_id: id, p_note: $('#c-note').value })); if (r !== undefined) { closeSheet(); toast('Работа отменена'); refreshOrder(id); } break; }
    case 'sq': {
      const k = d.k; const dd = +d.d;
      if (k[0] === 'x') { const e2 = SEND.extra[+k.slice(1)]; e2.qty = Math.max(0, e2.qty + dd); } else SEND.qty[k] = Math.max(0, (SEND.qty[k] || 0) + dd);
      SEND.due = $('#s-due').value; SEND.note = $('#s-note').value;
      const sc = $('.sheet').scrollTop; renderSend(); $('.sheet').scrollTop = sc; break;
    }
    case 'sp': SEND.purpose = d.v; SEND.due = $('#s-due').value; SEND.note = $('#s-note').value; renderSend(); break;
    case 'sx': { const n = $('#s-xn').value.trim(); if (!n) break; SEND.extra.push({ name: n, qty: 1 }); SEND.due = $('#s-due').value; SEND.note = $('#s-note').value; const sc = $('.sheet').scrollTop; renderSend(); $('.sheet').scrollTop = sc + 60; break; }
    case 'send-go': doSend(); break;
    case 'recv-go': doReceive(); break;
    case 'bq': { const it = outstanding(S.order)[+d.n]; BACK.q[it.name] = Math.min(it.left, Math.max(0, (BACK.q[it.name] || 0) + +d.d)); renderBack(); break; }
    case 'back-go': doBack(); break;
    case 'ready-go': { const id = S.order.order.id; const p = $('#r-p [aria-pressed=true]')?.dataset.v; const r = await guard(() => call('lab_ready', { p_id: id, p_purpose: p, p_note: $('#r-note').value })); if (r !== undefined) { closeSheet(); toast('Клиника увидит, что работа едет'); refreshOrder(id); } break; }
    case 'delay-go': { const id = S.order.order.id; const r = await guard(() => call('lab_delay', { p_id: id, p_on: true, p_note: $('#d-note').value })); if (r !== undefined) { closeSheet(); toast('Клиника получила отметку о задержке'); refreshOrder(id); } break; }
    case 'attach': { const fi = $('#fileIn'); fi.removeAttribute('capture'); fi.accept = ''; fi.click(); break; }
    case 'attach-cam': { const fi = $('#fileIn'); fi.accept = 'image/*'; fi.setAttribute('capture', 'environment'); fi.click(); break; }
    case 'unpend': S.pend.splice(+d.i, 1); { const m = $('#msg'); if (m) S.draft[S.oid] = m.value; } renderOrder(); break;
    case 'send-msg': sendMsg(); break;
    // статистика
    case 'srange': S.statsRange = +d.n; renderStats(); break;
    case 'csv': csv(); break;
    // настройки
    case 'u-new': userSheet(); break;
    case 'u-edit': userSheet(S.users.find((u) => u.id === +d.id)); break;
    case 'u-save': {
      const r0 = $('#u-role').value;
      const p = { id: d.id ? +d.id : null, role: r0, name: $('#u-name').value, login: $('#u-login').value, password: $('#u-pass').value, lab_id: r0 === 'lab' ? +$('#u-lab').value : null, active: $('#u-act') ? $('#u-act').checked : true };
      const r = await guard(() => call('lab_user_save', { p }));
      if (!r) break; if (!r.ok) { toast(ERR[r.err] || r.err, true); break; }
      if (r.pin) pinSheet(p.name, r.pin); else { closeSheet(); toast('Сохранено'); }
      await loadAll(); renderSettings(); break;
    }
    case 'u-pin': { const u = S.users.find((x) => x.id === +d.id); const pin = await guard(() => call('lab_user_pin', { p_id: +d.id })); if (pin) pinSheet(u.name, pin); break; }
    case 'l-new': case 'l-edit': {
      const l = d.id ? S.boot.labs.find((x) => x.id === +d.id) : { name: '', active: true };
      sheet(`<h3>${d.id ? 'Лаборатория' : 'Новая лаборатория'}</h3><label class="field"><span>Название</span><input class="inp" id="lb-n" value="${esc(l.name)}"></label>${d.id ? `<label class="chk"><input type="checkbox" id="lb-a" ${l.active ? 'checked' : ''}> Активна</label>` : ''}<div class="acts"><button class="btn" data-act="l-save" data-id="${d.id || ''}">Сохранить</button></div>`); break;
    }
    case 'l-save': { const r = await guard(() => call('lab_lab_save', { p_id: d.id ? +d.id : null, p_name: $('#lb-n').value, p_active: $('#lb-a') ? $('#lb-a').checked : true })); if (r) { closeSheet(); await loadAll(); renderSettings(); } break; }
    case 'c-new': case 'c-edit': {
      const c = d.id ? S.boot.catalog.find((x) => x.id === +d.id) : { grp: '', name: '', returnable: true, active: true, sort: null };
      const groups = [...new Set(S.boot.catalog.map((x) => x.grp))];
      sheet(`<h3>${d.id ? 'Предмет' : 'Новый предмет'}</h3>
        <label class="field"><span>Группа</span><input class="inp" id="c-g" list="c-gl" value="${esc(c.grp)}"><datalist id="c-gl">${groups.map((g) => `<option value="${esc(g)}">`).join('')}</datalist></label>
        <label class="field"><span>Название</span><input class="inp" id="c-n" value="${esc(c.name)}"></label>
        <label class="chk"><input type="checkbox" id="c-r" ${c.returnable ? 'checked' : ''}> Должен вернуться в клинику</label>
        ${d.id ? `<label class="chk"><input type="checkbox" id="c-a" ${c.active ? 'checked' : ''}> Показывать в списке</label>` : ''}
        <div class="acts"><button class="btn" data-act="c-save" data-id="${d.id || ''}">Сохранить</button>${d.id ? `<button class="btn bad" data-act="c-del" data-id="${d.id}">Удалить</button>` : ''}</div>`); break;
    }
    case 'c-save': { const p = { id: d.id ? +d.id : null, grp: $('#c-g').value, name: $('#c-n').value, returnable: $('#c-r').checked, active: $('#c-a') ? $('#c-a').checked : true }; const r = await guard(() => call('lab_cat_save', { p })); if (r) { closeSheet(); await loadAll(); renderSettings(); } break; }
    case 'b-up': S.brandKey = d.k; $('#b-file').click(); break;
    case 'b-del': { const r = await guard(() => call('lab_brand_set', { p_key: 'logo:' + d.k, p_value: null })); if (r !== undefined) { await loadAll(); renderSettings(); } break; }
    case 'c-del': { const r = await guard(() => call('lab_cat_delete', { p_id: +d.id })); if (r) { closeSheet(); toast(r === 'deleted' ? 'Предмет удалён' : 'Предмет уже отправлялся — он скрыт из списка, история сохранена'); await loadAll(); renderSettings(); } break; }
    case 'clean': {
      const st = S.storage; const target = st.limit * 0.6; let need = st.used - target; const pick = [];
      for (const c of st.closed) { if (need <= 0 && pick.length) break; pick.push(c); need -= Number(c.bytes); }
      const sz = pick.reduce((s, c) => s + Number(c.bytes), 0);
      S.cleanIds = pick.map((c) => c.id);
      sheet(`<h3>Освободить место</h3><div>Будут удалены фото и файлы <b>${pick.length}</b> самых старых закрытых работ — примерно <b>${mb(sz)}</b>.</div>
        <div class="small mut" style="margin-top:8px">Работы, переписка и история останутся. Удалённые файлы восстановить нельзя.</div>
        <div class="acts"><button class="btn bad" data-act="clean-go">Удалить файлы</button></div>`); break;
    }
    case 'clean-go': { t.disabled = true; try { const r = await fnFiles({ action: 'cleanup', order_ids: S.cleanIds }); closeSheet(); toast(`Удалено файлов: ${r.count}, освобождено ${mb(r.freed)}`); await loadAll(); renderSettings(); } catch (e2) { toast(errText(e2), true); t.disabled = false; } break; }
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { const lb = $('.lb'); if (lb) lb.remove(); else closeSheet(); }
  if ($('#ov') && $('.pad') && /^[0-9]$/.test(e.key)) pinKey(e.key);
  if ($('#ov') && $('.pad') && e.key === 'Backspace') pinKey('⌫');
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.id === 'msg') sendMsg();
});

/* ============================ онлайн-обновления ============================ */
let ws = null, wsHb = null, chgT = null; const chgIds = new Set();
function realtime() {
  if (!S.tok || ws) return;
  try { ws = new WebSocket(SB.replace('https', 'wss') + '/realtime/v1/websocket?apikey=' + KEY + '&vsn=1.0.0'); } catch (e) { return; }
  let ref = 1;
  ws.onopen = () => {
    ws.send(JSON.stringify({ topic: 'realtime:gamlab', event: 'phx_join', payload: { config: { broadcast: { self: false, ack: false }, presence: { key: '' }, private: false }, access_token: KEY }, ref: String(ref++), join_ref: '1' }));
    wsHb = setInterval(() => { try { ws.send(JSON.stringify({ topic: 'phoenix', event: 'heartbeat', payload: {}, ref: String(ref++) })); } catch (e) {} }, 25000);
  };
  ws.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch (x) { return; }
    if (m.event === 'phx_reply' && m.topic === 'realtime:gamlab' && m.payload && m.payload.status === 'ok' && !S.live) { S.live = true; renderWho(); }
    if (m.event === 'broadcast' && m.payload) {
      const p = m.payload; const oid = (p.payload && p.payload.o) ?? p.o;
      if (oid) chgIds.add(+oid);
      clearTimeout(chgT); chgT = setTimeout(onChange, 500);
    }
  };
  ws.onclose = () => { clearInterval(wsHb); ws = null; if (S.live) { S.live = false; renderWho(); } setTimeout(realtime, 5000); };
  ws.onerror = () => { try { ws.close(); } catch (e) {} };
}
async function onChange() {
  if (!S.tok) return;
  const ids = [...chgIds]; chgIds.clear();
  const [r, a] = route();
  const busy = $('#ov') || (document.activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName) && document.activeElement.id !== 'msg');
  await loadList();
  if (r === 'o' && ids.includes(+a) && !$('#ov') && !S.pend.some((p) => p.busy)) {
    const m = $('#msg'); const focused = document.activeElement === m; if (m) S.draft[+a] = m.value;
    await loadOrder(+a); if (route()[0] === 'o' && +route()[1] === +a) { renderOrder(); if (focused) { const n = $('#msg'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }
  } else if ((r === '' || r === undefined) && !busy) renderBoard();
  renderNav();
}

/* ============================ запуск ============================ */
async function boot() {
  renderBrand();
  await render();
  realtime();
  setInterval(() => { if (document.visibilityState === 'visible' && S.tok) { realtime(); if (!S.live) { chgIds.add(S.oid); onChange(); } } }, 60000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.tok) { realtime(); chgIds.add(S.oid); onChange(); } });
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
}
boot();
