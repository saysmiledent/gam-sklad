<style>
:root{
  --bg:#f7f6f3;--card:#fff;--ink:#2a3038;--mut:#68717a;--slate:#616a73;--blue:#88ace0;--deep:#3b66a6;
  --tint:#eaf1fa;--line:#e4e1da;--warn:#a85a08;--warnbg:#fdf0dc;--bad:#b42318;--badbg:#fde8e6;
  --ok:#2b7554;--okbg:#e3f2ea;--r:14px;
}

html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;

button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}

.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);

.btn-login{background:var(--deep);color:#fff;border:0;border-radius:999px;padding:10px 18px;font-weight:600;min-height:42px}

main{max-width:980px;margin:0 auto;padding:14px 16px 0}
.banner{border-radius:12px;padding:11px 14px;margin:0 0 12px;font-size:15px;display:flex;gap:10px;align-items:center;justify-content:space-between}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
.card h3{margin:0 0 8px;font-size:16px}
.mut{color:var(--mut)}
.small{font-size:13.5px}

.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}

.linkbtn{border:0;background:none;color:var(--deep);padding:2px 0;font-size:13.5px;text-decoration:underline;text-underline-offset:3px;min-height:28px}

.basket{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:25;padding:0 16px}

.basket-in .clr{background:rgba(255,255,255,.16);color:#fff}
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:24;background:#fff;border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav.bar div{max-width:980px;margin:0 auto;display:flex;gap:6px}
nav.bar button{flex:1;border:0;background:none;border-radius:12px;padding:8px 4px;color:var(--mut);font-weight:600;font-size:14px;min-height:52px;position:relative}
nav.bar button[aria-current=page]{background:var(--tint);color:var(--deep)}
nav.bar .dot{position:absolute;top:2px;left:calc(50% + 24px);background:var(--bad);color:#fff;border-radius:999px;font-size:11.5px;min-width:19px;height:19px;line-height:19px;padding:0 5px;font-weight:700}

.btn{border:0;background:var(--deep);color:#fff;border-radius:12px;padding:12px 18px;font-weight:700;min-height:46px}
.btn.alt{background:#fff;color:var(--deep);border:1.5px solid var(--deep)}
.btn.ghost{background:#eef1f5;color:var(--slate)}
.btn.bad{background:var(--bad)}
.btn.sm{padding:8px 12px;min-height:38px;font-size:14.5px;border-radius:10px}
.btn[disabled]{opacity:.5}
.field{display:block;margin:0 0 12px}
.field>span{display:block;font-weight:600;font-size:14px;color:var(--slate);margin-bottom:5px}
.inp{width:100%;border:1px solid #cfccc4;background:#fff;border-radius:11px;padding:11px 12px;min-height:46px}
textarea.inp{min-height:130px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
.rowx{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}

.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--r);background:#fff;margin-bottom:12px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:9px 11px;text-align:right;white-space:nowrap;border-top:1px solid var(--line)}
th{background:#f1efea;color:var(--slate);font-size:13px;border-top:0}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:150px}
tr.click{cursor:pointer}
tr.click:hover td{background:#f4f8fd}

.ov{position:fixed;inset:0;background:rgba(30,38,50,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));position:relative}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:20px}}
.sheet h3{margin:0 0 12px;font-size:19px;padding-right:36px}
.sheet .x{position:absolute;top:10px;right:10px;width:40px;height:40px;border:0;border-radius:50%;background:#eef1f5;font-size:24px;line-height:1;color:var(--slate)}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.acts .btn{flex:1}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:6px 0 12px}
.pick button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 10px;font-weight:600;min-height:52px;overflow-wrap:anywhere}
.pick button:active{background:var(--tint)}
.dots{display:flex;gap:14px;justify-content:center;margin:10px 0 16px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--deep);display:block}
.dots i.on{background:var(--deep)}
.dots.err i{border-color:var(--bad);background:var(--badbg)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto}
.pad button{border:1px solid var(--line);background:#fff;border-radius:16px;height:62px;font-size:24px;font-weight:600}
.pad button:active{background:var(--tint)}
.pad .e{visibility:hidden}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.pin-show{font-size:44px;letter-spacing:.3em;text-align:center;font-weight:700;color:var(--deep);background:var(--tint);border-radius:14px;padding:12px 0 12px .3em;margin:8px 0}
#toast{position:fixed;left:0;right:0;bottom:calc(138px + env(safe-area-inset-bottom));z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{pointer-events:auto;background:#2a3038;color:#fff;border-radius:12px;padding:11px 14px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 22px rgba(0,0,0,.25);max-width:520px}
.toast.bad{background:var(--bad)}
.toast button{border:0;background:none;color:#9fc0f2;font-weight:700;padding:4px 2px}
.sub{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px;scrollbar-width:none}
.sub::-webkit-scrollbar{display:none}
.sub button{flex:none;border:0;background:#e9e7e1;color:var(--slate);border-radius:10px;padding:9px 13px;font-weight:600;min-height:40px}
.sub button[aria-selected=true]{background:var(--slate);color:#fff}
.loading{padding:30px;text-align:center;color:var(--mut)}
.bars{display:flex;align-items:flex-end;gap:3px;height:150px;margin:10px 0 4px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;min-width:4px;height:100%}
.bars i{display:block;background:var(--blue)}
.bars i.u{background:#e49a4a}
.foot{max-width:980px;margin:26px auto 0;padding:14px 16px;text-align:center;color:var(--mut);font-size:13.5px;display:flex;gap:9px;align-items:center;justify-content:center}
.foot svg{width:26px;height:26px}
.foot b{color:var(--slate)}
.chk{display:flex;gap:10px;align-items:center;min-height:40px}
.chk input{width:22px;height:22px;accent-color:var(--deep)}
.ordrow{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-top:1px solid var(--line)}
.ordrow:first-child{border-top:0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand" id="brand"></div>
  <div id="who"></div>
</div></header>
<main id="main"><div class="loading">Загрузка…</div></main>
<div id="basket" class="basket hide"></div>
<nav class="bar" id="nav"><div></div></nav>
<div id="toast" aria-live="polite"></div>
<noscript><p style="padding:20px">Для работы склада нужен JavaScript.</p></noscript>

<script>
'use strict';
/* ============================ настройки ============================ */
const SB = 'https://wcnpreukerxvhzdoajfn.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndjbnByZXVrZXJ4dmh6ZG9hamZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQzMTA5OTgsImV4cCI6MjEwOTg4Njk5OH0.0A9392W0pPUl9MJzK4klUHDXfoh5xQIntwRcFq4ByWw';
const LOGO_SRC = ''; // когда пришлёте логотип клиники — путь к файлу, например 'logo.png'
const UNITS = ['шт', 'упаковка', 'пара', 'шприц', 'флакон', 'тюбик', 'рулон', 'коробка', 'набор', 'пачка'];

/* ============================ утилиты ============================ */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LS = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const fmt = (n, d = 2) => (n == null ? '—' : Number(n).toLocaleString('ru-RU', { maximumFractionDigits: d }));
const when = (iso) => new Date(iso).toLocaleString('ru-RU', { timeZone: 'Europe/Moscow', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
const dayStr = (d) => d.toISOString().slice(0, 10);
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const mskDay = () => +new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Moscow', day: 'numeric' }).format(new Date());
const mskDate = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Moscow' }).format(new Date());

const MARK = (s = 28) => `<svg viewBox="0 0 64 64" width="${s}" height="${s}" aria-hidden="true"><ellipse cx="22" cy="21" rx="4.4" ry="6.4" fill="#616a73"/><ellipse cx="42" cy="21" rx="4.4" ry="6.4" fill="#616a73"/><path d="M13 37Q32 58 51 37" fill="none" stroke="#88ace0" stroke-width="6.5" stroke-linecap="round"/></svg>`;

/* ============================ состояние ============================ */
const S = {
  cats: [], items: [], ov: null, recents: [],
  staff: LS.get('gam_staff'), adminOn: false,
  basket: {}, cat: null, q: '', view: 'stock', atab: 'analytics', range: 30,
  online: true, loaded: false, staffList: [], recvList: [], logList: [],
};
let admin = LS.get('gam_admin');
const role = () => (S.adminOn ? 'admin' : S.staff ? 'staff' : null);
const tok = () => (S.adminOn ? null : S.staff ? S.staff.token : null);

/* ============================ сеть ============================ */
async function refreshAdmin() {
  try {
    const r = await fetch(SB + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: admin.refresh }),
    });
    if (!r.ok) throw new Error('refresh');
    const j = await r.json();
    admin = { access: j.access_token, refresh: j.refresh_token, exp: j.expires_at || Math.floor(Date.now() / 1000 + j.expires_in), email: admin.email };
    LS.set('gam_admin', admin);
  } catch (e) { admin = null; S.adminOn = false; LS.del('gam_admin'); }
}
async function api(path, opt = {}) {
  if (admin && admin.exp - Date.now() / 1000 < 90) await refreshAdmin();
  const headers = { apikey: KEY, Authorization: 'Bearer ' + (admin ? admin.access : KEY), 'Content-Type': 'application/json' };
  const r = await fetch(SB + path, { ...opt, headers: { ...headers, ...(opt.headers || {}) } });
  if (!r.ok) {
    let j = null; try { j = await r.json(); } catch (e) {}
    const err = new Error((j && (j.message || j.msg || j.error_description)) || r.statusText);
    err.status = r.status; err.code = j && j.code; throw err;
  }
  return r.status === 204 ? null : r.json();
}
const rpc = (fn, args) => api('/rest/v1/rpc/' + fn, { method: 'POST', body: JSON.stringify(args || {}) });
const get = (p) => api('/rest/v1/' + p);

function errText(e) {
  const m = String(e && e.message || e);
  if (m === 'AUTH') return 'Нужно войти заново';
  if (e instanceof TypeError || /fetch|network/i.test(m)) return 'Нет связи с сервером. Проверьте интернет';
  if (m === 'BADQTY') return 'Неверное количество';
  if (m === 'NOITEM') return 'Позиция не найдена';
  if (m === 'EMPTY') return 'Заполните обязательные поля';
  return m;
}
async function guard(fn) {
  try { return await fn(); } catch (e) {
    if (String(e.message) === 'AUTH') { await doLogout(true); }
    toast(errText(e), { bad: true, ms: 5000 });
    return undefined;
  }
}

/* ============================ окна и уведомления ============================ */
function sheet(html) {
  closeSheet();
  const d = document.createElement('div');
  d.className = 'ov';
  d.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><button class="x" data-act="close" aria-label="Закрыть">×</button>${html}</div>`;
  d.addEventListener('click', (e) => { if (e.target === d) closeSheet(); });
  document.body.appendChild(d);
  document.body.style.overflow = 'hidden';
  return d.querySelector('.sheet');
}
function closeSheet() { document.querySelectorAll('.ov').forEach((x) => x.remove()); document.body.style.overflow = ''; }
function toast(msg, o = {}) {
  const t = document.createElement('div');
  t.className = 'toast' + (o.bad ? ' bad' : '');
  t.innerHTML = `<span>${esc(msg)}</span>${o.label ? `<button>${esc(o.label)}</button>` : ''}`;
  if (o.label) t.querySelector('button').onclick = () => { t.remove(); o.action && o.action(); };
  $('#toast').appendChild(t);
  setTimeout(() => t.remove(), o.ms || 4500);
}
function csvDownload(name, rows) {
  const line = (r) => r.map((c) => { const s = String(c ?? ''); return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(';');
  const blob = new Blob(['﻿' + rows.map(line).join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ============================ данные ============================ */
const itemById = (id) => S.items.find((i) => i.id === id);
const catById = (id) => S.cats.find((c) => c.id === id);
const isLow = (i) => i.min_qty != null && i.stock <= i.min_qty;
const orderState = () => {
  const m = {};
  if (S.ov) (S.ov.entries || []).forEach((e) => { if (e.item_id && (e.status === 'open' || e.status === 'ordered')) m[e.item_id] = e.status; });
  return m;
};
const orderBadge = () => {
  if (!S.ov) return 0;
  const auto = (S.ov.auto || []).filter((a) => !a.in_manual).length;
  return auto + (S.ov.entries || []).filter((e) => e.status === 'open').length;
};

async function loadData(silent) {
  try {
    const [cats, items] = await Promise.all([
      get('categories?select=id,name,sort&order=sort,name'),
      get('items?select=id,category_id,name,unit,stock,min_qty,active&order=name'),
    ]);
    S.cats = cats; S.items = items; S.online = true; S.loaded = true;
    if (role()) {
      try { S.ov = await rpc('order_overview', { p_token: tok() }); } catch (e) { if (String(e.message) === 'AUTH') await doLogout(true); }
      try { S.recents = role() === 'staff' ? await rpc('my_recent', { p_token: tok() }) : []; } catch (e) { S.recents = []; }
    } else { S.ov = null; S.recents = []; }
    if (!S.cat || (S.cat !== '__all' && S.cat !== '__low' && !catById(+S.cat))) S.cat = S.cats[0] ? S.cats[0].id : '__all';
  } catch (e) {
    S.online = false;
    if (!silent) toast(errText(e), { bad: true });
  }
  if (!document.querySelector('.ov')) render();
}

/* ============================ отрисовка ============================ */
function renderBrand() {
  $('#brand').innerHTML = (LOGO_SRC ? `<img src="${esc(LOGO_SRC)}" alt="GAM CLINIC">` : `<b>GAM CLINIC</b>`) + `<small>Склад · расходные материалы</small>`;
}
function renderWho() {
  const r = role();
  $('#who').innerHTML = r
    ? `<button class="chip-user" data-act="account">${r === 'admin' ? 'Администратор' : esc(S.staff.name)}</button>`
    : `<button class="btn-login" data-act="login">Войти</button>`;
}
function renderNav() {

/* ---------- склад ---------- */
function stockHTML() {
  const r = role(); let h = '';
  if (!r) h += `<div class="banner info"><span>Остатки видны всем. Чтобы отметить расход, нажмите «Войти».</span></div>`;
  if (r && [1, 15].includes(mskDay()) && LS.get('gam_rem') !== mskDate()) {
    h += `<div class="banner warn"><span>Сегодня день заказа. Проверьте вкладку «Заказ».</span><button class="btn sm ghost" data-act="remdone">Скрыть</button></div>`;
  }
  if (S.recents.length) {
    const groups = {}; S.recents.forEach((x) => { (groups[x.batch] = groups[x.batch] || []).push(x); });
    h += `<div class="card"><h3>Ваши последние записи</h3><div class="small mut" style="margin-bottom:8px">Ошиблись? В течение 10 минут запись можно отменить.</div>` +
      Object.values(groups).map((g) => `<div class="rowx" style="margin-bottom:6px"><div class="grow small">${g.map((x) => `${esc(x.item)} — ${x.qty} ${esc(x.unit)}`).join('<br>')}</div><button class="btn sm alt" data-act="undo" data-ids="${g.map((x) => x.id).join(',')}">Отменить</button></div>`).join('') + `</div>`;
  }
  const active = S.items.filter((i) => i.active);
  const lowN = active.filter(isLow).length;
  const cnt = (id) => active.filter((i) => i.category_id === id).length;
  h += `<div class="tabs" role="tablist">` +
    S.cats.map((c) => `<button class="tab" role="tab" data-act="cat" data-id="${c.id}" aria-selected="${String(S.cat) === String(c.id)}">${esc(c.name)}<small>${cnt(c.id)}</small></button>`).join('') +
    `<button class="tab" role="tab" data-act="cat" data-id="__all" aria-selected="${S.cat === '__all'}">Все<small>${active.length}</small></button>` +
    `<button class="tab alert" role="tab" data-act="cat" data-id="__low" aria-selected="${S.cat === '__low'}">Мало<small>${lowN}</small></button></div>`;
  h += `<input class="search" id="q" type="search" placeholder="Поиск по названию" value="${esc(S.q)}" autocomplete="off">`;
  h += `<div class="list" id="list">${listHTML()}</div>`;
  return h;
}
function listHTML() {
  const q = S.q.trim().toLowerCase(); const r = role(); const os = orderState();
  let items = S.items.filter((i) => i.active);
  if (S.cat === '__low') items = items.filter(isLow);
  else if (S.cat !== '__all') items = items.filter((i) => String(i.category_id) === String(S.cat));
  if (q) items = items.filter((i) => i.name.toLowerCase().includes(q));
  if (!items.length) return `<div class="empty">${q ? 'Ничего не найдено' : S.cat === '__low' ? 'Всё в наличии — ничего не заканчивается' : 'В этой категории пока нет позиций'}</div>`;
  const row = (i) => {
    const inB = S.basket[i.id] || 0; const low = isLow(i); const st = os[i.id];
    const tags = [];
    if (low) tags.push(`<span class="tag bad">ниже минимума (${i.min_qty})</span>`);
    if (st === 'ordered') tags.push(`<span class="tag blue">заказано</span>`);
    else if (st === 'open') tags.push(`<span class="tag warn">в списке заказа</span>`);
    const flag = r && i.min_qty == null && !st ? `<button class="linkbtn" data-act="flag" data-id="${i.id}">Заканчивается</button>` : '';
    const ctl = r ? (inB
      ? `<div class="step"><button data-act="dec" data-id="${i.id}" aria-label="Меньше">−</button><span>${inB}</span><button data-act="inc" data-id="${i.id}" aria-label="Больше">+</button></div>`
      : `<button class="plus" data-act="inc" data-id="${i.id}" aria-label="Взять: ${esc(i.name)}">+</button>`) : '';
    return `<div class="row ${inB ? 'is-in' : ''}"><div class="rn"><div class="nm">${esc(i.name)}</div><div class="meta">${tags.join('')}${flag}</div></div>` +
      `<div class="st"><b class="${i.stock <= 0 || low ? 'low' : ''}">${i.stock}</b><small>${esc(i.unit)}</small></div>${ctl}</div>`;
  };
  if (S.cat === '__all' || S.cat === '__low') {
    let out = ''; S.cats.forEach((c) => { const g = items.filter((i) => i.category_id === c.id); if (g.length) out += `<div class="gh">${esc(c.name)}</div>` + g.map(row).join(''); });
    return out;
  }
  return items.map(row).join('');
}

    (open.length ? open.map((e) => `<div class="ordrow">${chk('data-eid', e.id)}<div class="grow"><div class="nm">${esc(e.name)}${e.free ? ' <span class="tag warn">нет на складе</span>' : ''}</div>` +
      `<div class="small mut">${e.doctor ? 'Врач: ' + esc(e.doctor) + ' · ' : ''}${e.note ? esc(e.note) + ' · ' : ''}${esc(e.by)} · ${when(e.created_at)}</div></div>` +
      `<span class="tag ${e.by === 'автоматически' ? 'blue' : ''}">${e.by === 'автоматически' ? 'автоматически' : 'вручную'}</span>${adm ? `<button class="btn sm ghost" data-act="ocancel" data-id="${e.id}">×</button>` : ''}</div>`).join('') : `<div class="empty">Пока пусто</div>`) + `</div>`;
  if (adm) h += `<div class="rowx" style="margin-bottom:14px"><button class="btn" data-act="markordered">Отметить выбранные как «Заказано»</button></div>`;
  if (ordered.length) h += `<div class="card" style="padding:0;overflow:hidden"><div class="gh">Заказано, ждём поставку (${ordered.length})</div>` + ordered.map((e) =>
    `<div class="ordrow"><div class="grow"><div class="nm">${esc(e.name)}</div><div class="small mut">заказано ${e.ordered_at ? when(e.ordered_at) : ''}${e.doctor ? ' · врач: ' + esc(e.doctor) : ''}</div></div>` +
    (adm ? `<button class="btn sm" data-act="oreceive" data-id="${e.id}" data-item="${e.item_id || ''}">Получено</button><button class="btn sm ghost" data-act="oback" data-id="${e.id}">Назад</button>` : '') + `</div>`).join('') + `</div>`;

/* аналитика */
let ANA = [];
async function paneAnalytics() {

  const [rows, usage] = await Promise.all([rpc('admin_analytics', { p_from: dayStr(from), p_to: dayStr(to) }), rpc('admin_staff_usage', { p_from: dayStr(from), p_to: dayStr(to) })]);
  ANA = rows;

  h += `<p class="small mut" style="margin-top:0">Расход = списания ассистентов + неучтённое (разница, найденная при инвентаризации). Среднее считается с первого движения по позиции. Нажмите на строку — график.</p>`;
  h += used.length ? `<div class="tw"><table><thead><tr><th>Позиция</th><th>Расход</th><th>из них неучт.</th><th>в день</th><th>в неделю</th><th>в месяц</th><th>остаток</th><th>хватит на, дн.</th></tr></thead><tbody>` +
    used.map((r) => `<tr class="click" data-act="series" data-id="${r.item_id}"><td>${esc(r.name)}<div class="small mut">${esc(r.category)} · ${esc(r.unit)}</div></td><td>${r.total}</td><td class="${r.unrec ? 'neg' : ''}">${r.unrec || '—'}</td><td>${fmt(r.per_day)}</td><td>${fmt(r.per_week, 1)}</td><td>${fmt(r.per_month, 0)}</td><td>${r.stock}</td><td class="${r.days_left != null && r.days_left <= 14 ? 'neg' : ''}">${r.days_left ?? '—'}</td></tr>`).join('') + `</tbody></table></div>`
    : `<div class="card empty">За выбранный период расхода пока нет. Данные появятся, когда ассистенты начнут отмечать материалы.</div>`;
  h += `<h2>Кто сколько отмечал</h2><div class="tw"><table><thead><tr><th>Сотрудник</th><th>записей</th><th>единиц</th><th>последняя</th></tr></thead><tbody>` +
    usage.map((u) => `<tr><td>${esc(u.name)}${u.active ? '' : ' <span class="tag">отключён</span>'}</td><td>${u.sessions}</td><td>${u.qty}</td><td>${u.last_at ? when(u.last_at) : '—'}</td></tr>`).join('') + `</tbody></table></div>`;
  pane(h);
}
async function openSeries(id, bucket = 'day') {
  const it = itemById(+id); const to = new Date(); const from = addDays(to, -(S.range - 1));
  const ser = await rpc('admin_series', { p_item_id: +id, p_from: dayStr(from), p_to: dayStr(to), p_bucket: bucket });
  const mx = Math.max(1, ...ser.map((s) => s.taken + s.unrec));
  const bars = ser.length ? ser.map((s) => `<div title="${s.b}: ${s.taken} + ${s.unrec} неучт."><i class="u" style="height:${(s.unrec / mx) * 100}%"></i><i style="height:${(s.taken / mx) * 100}%"></i></div>`).join('') : '';
  sheet(`<h3>${esc(it ? it.name : '')}</h3><div class="rowx">${[['day', 'По дням'], ['week', 'По неделям'], ['month', 'По месяцам']].map(([b, l]) => `<button class="btn sm ${b === bucket ? '' : 'ghost'}" data-act="seriesb" data-id="${id}" data-b="${b}">${l}</button>`).join('')}</div>` +
    (ser.length ? `<div class="bars">${bars}</div><div class="small mut">Синий — отмечено ассистентами, оранжевый — неучтённое. Максимум столбца: ${mx} ${esc(it ? it.unit : '')}.</div>
    <div class="tw" style="margin-top:12px"><table><thead><tr><th>Период</th><th>отмечено</th><th>неучт.</th></tr></thead><tbody>${ser.slice().reverse().map((s) => `<tr><td>${s.b}</td><td>${s.taken}</td><td>${s.unrec}</td></tr>`).join('')}</tbody></table></div>` : `<div class="empty">Нет расхода за период</div>`));
}

async function pinKey(n) {
  if (PIN.busy) return;
  if (n === 'x') PIN.v = PIN.v.slice(0, -1); else if (PIN.v.length < 4) PIN.v += n;
  const dots = $('#dots'); if (!dots) return;
  dots.className = 'dots'; [...dots.children].forEach((d, i) => d.classList.toggle('on', i < PIN.v.length));
  if (PIN.v.length === 4) {
    PIN.busy = true; $('#pinmsg').textContent = '';
    try {
      const r = await rpc('staff_login', { p_staff_id: PIN.id, p_pin: PIN.v, p_remember: $('#remember').checked });
      if (r.ok) {
        S.staff = { token: r.token, name: r.name, id: r.staff_id }; S.adminOn = false; LS.set('gam_staff', S.staff);
        closeSheet(); S.view = 'stock'; toast('Здравствуйте, ' + r.name); await loadData(true); render(); return;
      }
      dots.className = 'dots err shake';
      $('#pinmsg').textContent = r.error === 'LOCKED' ? 'Слишком много попыток. Подождите 15 минут или обратитесь к администратору.' : r.error === 'NOUSER' ? 'Сотрудник не найден или отключён' : `Неверный код. Осталось попыток: ${r.left}`;
    } catch (e) { $('#pinmsg').textContent = errText(e); }
    PIN.v = ''; PIN.busy = false; setTimeout(() => { const d = $('#dots'); if (d) { d.className = 'dots'; [...d.children].forEach((x) => x.classList.remove('on')); } }, 700);
  }
}

async function adminEnter() {

function parseImport(t) {
  return t.split(/\r?\n/).map((l) => l.trim()).filter(Boolean).map((l) => {
    const p = (l.includes('\t') ? l.split('\t') : l.split(';')).map((x) => x.trim());
    return { category: p[0], name: p[1], unit: p[2] || 'шт', qty: p[3] ? parseInt(p[3], 10) : 0, min: p[4] ? parseInt(p[4], 10) : null };
  }).filter((r) => r.category && r.name);
}

/* ============================ обработчик кликов ============================ */
document.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act; const d = t.dataset;
  const refreshList = () => { const l = $('#list'); if (l) l.innerHTML = listHTML(); renderBasket(); };
  switch (a) {
    case 'close': closeSheet(); break;
    case 'login': loginSheet(); break;
    case 'adminlogin': adminLoginSheet(); break;
    case 'adminenter': t.disabled = true; await adminEnter(); t.disabled = false; break;
    case 'pickstaff': pinSheet(+d.id, d.name); break;
    case 'pin': pinKey(d.n); break;
    case 'account': sheet(`<h3>${role() === 'admin' ? 'Администратор' : esc(S.staff.name)}</h3><div class="acts"><button class="btn ghost" data-act="close">Закрыть</button><button class="btn bad" data-act="logout">Выйти</button></div>`); break;
    case 'logout': doLogout(); break;
    case 'nav': S.view = d.v; render(); window.scrollTo(0, 0); break;
    case 'reload': loadData(); break;
    case 'remdone': LS.set('gam_rem', mskDate()); render(); break;
    case 'cat': S.cat = d.id; render(); break;
    case 'inc': S.basket[d.id] = (S.basket[d.id] || 0) + 1; refreshList(); break;
    case 'dec': { const n = (S.basket[d.id] || 0) - 1; if (n > 0) S.basket[d.id] = n; else delete S.basket[d.id]; refreshList(); break; }
    case 'rinc': S.basket[d.id]++; takeReview(); break;
    case 'rdec': { const n = S.basket[d.id] - 1; if (n > 0) S.basket[d.id] = n; else delete S.basket[d.id]; if (Object.keys(S.basket).length) takeReview(); else closeSheet(); refreshList(); break; }
    case 'clear': S.basket = {}; refreshList(); break;
    case 'review': takeReview(); break;
    case 'takego': await takeGo(t); break;
    case 'undo': undoIds(d.ids.split(',').map(Number)); break;
    case 'flag': flagItem(d.id); break;
    case 'addorder': orderSheet(); break;
    case 'omode': { const n = d.m === 'new'; $('#o-item').classList.toggle('hide', n); $('#o-new').classList.toggle('hide', !n); $('#om-item').className = 'btn sm' + (n ? ' ghost' : ''); $('#om-new').className = 'btn sm' + (n ? '' : ' ghost'); break; }
    case 'ordersave': await orderSave(); break;
    case 'copyorder': try { await navigator.clipboard.writeText(orderText()); toast('Список скопирован'); } catch (err) { sheet(`<h3>Список заказа</h3><textarea class="inp" style="min-height:220px" readonly>${esc(orderText())}</textarea>`); } break;
    case 'markordered': {
      const { eids, autos } = selectedOrder(); if (!eids.length && !autos.length) { toast('Ничего не выбрано', { bad: true }); break; }
      const r = await guard(() => rpc('admin_mark_ordered', { p_ids: eids, p_auto_items: autos })); if (r) { toast('Отмечено как заказанное'); await loadData(true); } break;
    }
    case 'ocancel': { const r = await guard(() => rpc('admin_order_set', { p_id: +d.id, p_status: 'cancelled' })); if (r) await loadData(true); break; }
    case 'oback': { const r = await guard(() => rpc('admin_order_set', { p_id: +d.id, p_status: 'open' })); if (r) await loadData(true); break; }
    case 'oreceive': recvQty(d.id, d.item); break;
    case 'recvgo': { const q = parseInt(val('rq'), 10); if (!q || q < 1) { toast('Введите количество', { bad: true }); break; } const r = await guard(() => rpc('admin_receive', { p_items: [{ item_id: +d.item, qty: q }] })); if (r) { closeSheet(); toast('Принято на склад'); await loadData(true); } break; }
    case 'recvfree': { const r = await guard(() => rpc('admin_order_set', { p_id: +d.id, p_status: 'received' })); if (r) { closeSheet(); await loadData(true); } break; }
    /* админ */
    case 'atab': S.atab = d.k; render(); break;
    case 'range': S.range = +d.d; showAdmin(); break;
    case 'series': guard(() => openSeries(d.id)); break;
    case 'seriesb': guard(() => openSeries(d.id, d.b)); break;
    case 'csv-ana': { const to = new Date(); const rows = ANA.length ? ANA : await rpc('admin_analytics', { p_from: dayStr(addDays(to, -(S.range - 1))), p_to: dayStr(to) });
      csvDownload('rashod_' + mskDate() + '.csv', [['Категория', 'Позиция', 'Ед.', 'Расход', 'Неучтённое', 'Приход', 'В день', 'В неделю', 'В месяц', 'Остаток', 'Хватит на (дн.)']].concat(rows.map((r) => [r.category, r.name, r.unit, r.total, r.unrec, r.received, r.per_day, r.per_week, r.per_month, r.stock, r.days_left ?? '']))); break; }
    case 'csv-stock': csvDownload('ostatki_' + mskDate() + '.csv', [['Категория', 'Позиция', 'Ед.', 'Остаток', 'Минимум']].concat(S.items.filter((i) => i.active).map((i) => [(catById(i.category_id) || {}).name, i.name, i.unit, i.stock, i.min_qty ?? '']))); break;
    case 'csv-mv': { const mv = await guard(() => get('movements?select=occurred_at,kind,delta,note,cancelled_at,items(name,unit),staff(name)&order=occurred_at.desc&limit=5000'));
      if (mv) csvDownload('dvizhenie_' + mskDate() + '.csv', [['Дата', 'Тип', 'Позиция', 'Ед.', 'Кол-во', 'Кто', 'Примечание', 'Отменено']].concat(mv.map((m) => [when(m.occurred_at), m.kind, m.items && m.items.name, m.items && m.items.unit, m.delta, m.staff ? m.staff.name : 'админ', m.note || '', m.cancelled_at ? 'да' : '']))); break; }
    case 'recv-plus': { const id = +val('rsel'), q = parseInt(val('rqty'), 10); if (!id || !q || q < 1) { toast('Выберите позицию и количество', { bad: true }); break; } S.recvList.push({ item_id: id, qty: q }); $('#rqty').value = ''; drawRecv(); break; }
    case 'recv-add': { $('#rsel').value = d.item; $('#rqty').focus(); break; }
    case 'recv-del': S.recvList.splice(+d.n, 1); drawRecv(); break;
    case 'recv-save': { const r = await guard(() => rpc('admin_receive', { p_items: S.recvList })); if (r) { S.recvList = []; toast('Принято на склад'); await loadData(true); } break; }
    case 'count-save': {
      const counts = [...document.querySelectorAll('.cnt')].filter((x) => x.value !== '').map((x) => ({ item_id: +x.dataset.id, counted: parseInt(x.value, 10) }));
      if (!counts.length) { toast('Не введено ни одного количества', { bad: true }); break; }
      const r = await guard(() => rpc('admin_stocktake', { p_counts: counts, p_note: 'Инвентаризация' })); if (!r) break;
      await loadData(true);
      const ch = r.changes || [];
      sheet(`<h3>Инвентаризация сохранена</h3>${ch.length ? `<div class="tw"><table><thead><tr><th>Позиция</th><th>было</th><th>стало</th><th>разница</th></tr></thead><tbody>${ch.map((c) => { const it = itemById(c.item_id); return `<tr><td>${esc(it ? it.name : '')}</td><td>${c.before}</td><td>${c.after}</td><td class="${c.diff < 0 ? 'neg' : ''}">${c.diff > 0 ? '+' : ''}${c.diff}</td></tr>`; }).join('')}</tbody></table></div><p class="small mut">Отрицательная разница записана как неучтённый расход.</p>` : '<p>Расхождений нет — всё сходится.</p>'}`);
      break;
    }
    case 'item-new': itemForm(null); break;
    case 'item-edit': itemForm(itemById(+d.id)); break;
    case 'item-save': {
      const cat = +val('f-cat'), name = val('f-name').trim(), unit = val('f-unit').trim() || 'шт', minv = val('f-min').trim() === '' ? null : parseInt(val('f-min'), 10);
      if (!name) { toast('Введите название', { bad: true }); break; }
      let r;
      if (!d.id) { const c = catById(cat); r = await guard(() => rpc('admin_import_items', { p_rows: [{ category: c.name, name, unit, qty: String(parseInt(val('f-qty'), 10) || 0), min: minv == null ? '' : String(minv) }] })); if (r && !r.created) { toast('Такая позиция уже есть в этой категории', { bad: true }); break; } }
      else r = await guard(() => rpc('admin_save_item', { p_id: +d.id, p_category_id: cat, p_name: name, p_unit: unit, p_min: minv, p_active: $('#f-act').checked }));
      if (r && r.ok !== false) { closeSheet(); toast('Сохранено'); await loadData(true); } else if (r) toast('Такая позиция уже есть', { bad: true });
      break;
    }
    case 'cat-new': case 'cat-edit': {
      const c = a === 'cat-edit' ? catById(+d.id) : null;
      sheet(`<h3>${c ? 'Переименовать категорию' : 'Новая категория'}</h3><label class="field"><span>Название</span><input class="inp" id="c-name" value="${esc(c ? c.name : '')}" maxlength="40"></label><div class="acts"><button class="btn" data-act="cat-save" data-id="${c ? c.id : ''}">Сохранить</button></div>`); break;
    }
    case 'cat-save': { const r = await guard(() => rpc('admin_save_category', { p_id: d.id ? +d.id : null, p_name: val('c-name'), p_sort: null })); if (r) { if (r.ok) { closeSheet(); await loadData(true); } else toast('Категория с таким названием уже есть', { bad: true }); } break; }
    case 'import': importSheet(); break;
    case 'impgo': {
      const rows = parseImport(val('imp')); if (!rows.length) { toast('Не нашёл ни одной строки', { bad: true }); break; }
      const r = await guard(() => rpc('admin_import_items', { p_rows: rows.map((x) => ({ category: x.category, name: x.name, unit: x.unit, qty: String(x.qty || 0), min: x.min == null || isNaN(x.min) ? '' : String(x.min) })) }));
      if (r) { closeSheet(); toast(`Добавлено: ${r.created}, пропущено (уже есть): ${r.skipped}`, { ms: 7000 }); await loadData(true); } break;
    }
    case 'staff-new': sheet(`<h3>Новый сотрудник</h3><label class="field"><span>Имя (как будет в списке)</span><input class="inp" id="s-name" maxlength="40" placeholder="Например: Алина"></label><div class="acts"><button class="btn" data-act="staff-add">Создать и получить код</button></div>`); break;
    case 'staff-add': { const r = await guard(() => rpc('admin_staff_create', { p_name: val('s-name') })); if (r) { if (r.ok) { pinShow(val('s-name'), r.pin); showAdmin(); } else toast('Сотрудник с таким именем уже есть', { bad: true }); } break; }
    case 'staff-pin': { const s = S.staffList.find((x) => x.id === +d.id); const r = await guard(() => rpc('admin_staff_reset_pin', { p_id: +d.id })); if (r) pinShow(s ? s.name : '', r.pin); break; }
    case 'staff-unlock': { await guard(() => rpc('admin_staff_unlock', { p_id: +d.id })); showAdmin(); break; }
    case 'staff-toggle': { const r = await guard(() => rpc('admin_staff_set_active', { p_id: +d.id, p_active: d.on === '1' })); if (r && r.ok === false) toast('Активный сотрудник с таким именем уже есть', { bad: true }); showAdmin(); break; }
    case 'mv-cancel': { const r = await guard(() => rpc('cancel_movements', { p_token: null, p_ids: [+d.id] })); if (r) { toast('Запись отменена'); await loadData(true); } break; }
    case 'logtake': logTakeSheet(); break;
    case 'lt-add': { const id = +val('lt-sel'), q = parseInt(val('lt-qty'), 10); if (!id || !q) break; S.logList.push({ item_id: id, qty: q }); drawLog(); break; }
    case 'lt-del': S.logList.splice(+d.n, 1); drawLog(); break;
    case 'lt-go': {
      if (!S.logList.length) { toast('Добавьте хотя бы одну позицию', { bad: true }); break; }
      const when_ = val('lt-when'); const r = await guard(() => rpc('admin_log_take', { p_staff_id: +val('lt-staff'), p_items: S.logList, p_when: when_ ? new Date(when_).toISOString() : null }));
      if (r) { S.logList = []; closeSheet(); toast('Расход добавлен'); await loadData(true); } break;
    }
    case 'chpass': sheet(`<h3>Новый пароль</h3><label class="field"><span>Минимум 8 символов</span><input class="inp" id="np" type="password" autocomplete="new-password"></label><div class="acts"><button class="btn" data-act="chpass-go">Сохранить</button></div>`); break;
    case 'chpass-go': { const p = val('np'); if (p.length < 8) { toast('Слишком короткий пароль', { bad: true }); break; } const r = await guard(() => api('/auth/v1/user', { method: 'PUT', body: JSON.stringify({ password: p }) })); if (r) { closeSheet(); toast('Пароль изменён'); } break; }
  }
});
function pinShow(name, pin) {
  sheet(`<h3>Код для: ${esc(name)}</h3><div class="pin-show">${esc(pin)}</div><p class="small mut" style="text-align:center">Передайте код сотруднику. Он показывается один раз. Если забудете — нажмите «Новый код».</p><div class="acts"><button class="btn" data-act="close">Готово</button></div>`);
}
async function logTakeSheet() {
  const list = await guard(() => get('staff?select=id,name&active=eq.true&order=name')); if (!list) return;
  S.logList = [];
  const now = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  sheet(`<h3>Добавить забытый расход</h3><label class="field"><span>Кто брал</span><select class="inp" id="lt-staff">${list.map((s) => `<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></label>
    <label class="field"><span>Когда</span><input class="inp" id="lt-when" type="datetime-local" value="${now}"></label>
    <div class="rowx"><div class="grow">${itemSelect('lt-sel')}</div><input class="inp" id="lt-qty" type="number" min="1" inputmode="numeric" placeholder="шт" style="width:80px"><button class="btn sm" data-act="lt-add">+</button></div><div id="lt-list" style="margin-top:8px"></div>
    <div class="acts"><button class="btn" data-act="lt-go">Записать</button></div>`);
}
function drawLog() {
  const el = $('#lt-list'); if (!el) return;
  el.innerHTML = S.logList.map((x, n) => { const it = itemById(x.item_id); return `<div class="rowx small" style="margin-bottom:4px"><span class="grow">${esc(it ? it.name : '')} — ${x.qty} ${esc(it ? it.unit : '')}</span><button class="btn sm ghost" data-act="lt-del" data-n="${n}">×</button></div>`; }).join('');
}
document.addEventListener('input', (e) => {
  if (e.target.id === 'q') { S.q = e.target.value; const l = $('#list'); if (l) l.innerHTML = listHTML(); }
  else if (e.target.id === 'imp') { const n = parseImport(e.target.value).length; $('#imp-prev').textContent = n ? `Распознано позиций: ${n}` : ''; }
  else if (e.target.classList && e.target.classList.contains('cnt')) {
    const was = +e.target.dataset.was, v = e.target.value === '' ? null : parseInt(e.target.value, 10); const out = e.target.parentElement.querySelector('.diff');
    if (v == null || isNaN(v)) out.textContent = ''; else { const df = v - was; out.textContent = df === 0 ? '✓' : (df > 0 ? '+' : '') + df; out.style.color = df < 0 ? 'var(--bad)' : df > 0 ? 'var(--ok)' : 'var(--mut)'; }
  }
});

/* ============================ запуск ============================ */
async function boot() {
  renderBrand(); renderWho();
  if (admin) {
    try {
      if (admin.exp - Date.now() / 1000 < 90) await refreshAdmin();
      if (admin && (await rpc('claim_admin'))) S.adminOn = true; else { admin = null; LS.del('gam_admin'); }
    } catch (e) { /* без связи — попробуем позже */ S.adminOn = !!admin; }
  }
  if (!S.adminOn && S.staff) {
    try { const c = await rpc('session_check', { p_token: S.staff.token }); if (!c.ok) { S.staff = null; LS.del('gam_staff'); } } catch (e) {}
  }
  await loadData();
  setInterval(() => { if (document.visibilityState === 'visible' && !document.querySelector('.ov') && !(S.view === 'admin') && document.activeElement !== $('#q')) loadData(true); }, 45000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') loadData(true); });
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
}
boot();
</script>
</body>
</html>
